<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mary's Cycle Tracker</title>
<meta name="theme-color" content="#5fa839">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* ──────────────────────────────────────────────────────────────────
     Overworld palette. The scenery hues (grass, stone, water, lava) are
     scene-only; UI panels sit on their own solid surfaces so cycle data
     never has to be read against a gradient.
     ────────────────────────────────────────────────────────────────── */
  :root {
    color-scheme: light;

    /* UI */
    --page: #dfe9d6;
    --surface: #fbfaf5;
    --surface-2: #f0eee4;
    --ink: #17170f;
    --ink-secondary: #4d4c3f;
    --muted: #7d7c6d;
    --line: #17170f;
    --line-soft: #d6d3c4;
    --accent: #1d6f7d;
    --accent-ink: #ffffff;
    --accent-soft: #d5e9ec;
    --block-shadow: #17170f;

    /* Status */
    --warning-soft: #fbeccd;
    --warning-ink: #6b4a05;
    --critical: #c0392b;
    --critical-soft: #f7dcd8;
    --critical-ink: #7a1f1f;

    /* Scene */
    --sky-top: #6fb2e6;
    --sky-bottom: #b8dcf2;
    --sun: #ffe98a;
    --cloud: #ffffff;
    --mountain-far: #6d84a3;
    --mountain-near: #4f6480;
    --grass: #6aab3c;
    --grass-dark: #4d8c2a;
    --dirt: #8b6141;
    --dirt-dark: #6f4c33;
    --stone: #8d8d86;
    --stone-dark: #6b6b64;
    --water: #3f7fd6;
    --water-light: #6fa8ea;
    --water-foam: #dceaf8;
    --lava: #ef6f2b;
    --lava-bright: #ffc23d;
    --smoke: #b9b4ad;
    --dino: #35766a;
    --dino-dark: #24564d;
    --scrim: rgba(223, 233, 214, 0.30);
  }

  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #14180f;
      --surface: #22261b;
      --surface-2: #1a1e14;
      --ink: #f2f3e8;
      --ink-secondary: #c2c4b2;
      --muted: #8f9180;
      --line: #05060a;
      --line-soft: #34382a;
      --accent: #58cbbd;
      --accent-ink: #08201f;
      --accent-soft: #123330;
      --block-shadow: #05060a;

      --warning-soft: #3d3113;
      --warning-ink: #f2d590;
      --critical: #e8776a;
      --critical-soft: #3d1d19;
      --critical-ink: #f3aaa0;

      --sky-top: #10182f;
      --sky-bottom: #26355a;
      --sun: #e8eeff;
      --cloud: #43506f;
      --mountain-far: #2b3550;
      --mountain-near: #1c2438;
      --grass: #2f5f21;
      --grass-dark: #23491a;
      --dirt: #4a3527;
      --dirt-dark: #38281d;
      --stone: #4a4a46;
      --stone-dark: #35352f;
      --water: #2a55a0;
      --water-light: #3d74c4;
      --water-foam: #8fb4dd;
      --lava: #ff7a2f;
      --lava-bright: #ffd75e;
      --smoke: #4a4740;
      --dino: #4a9c8c;
      --dino-dark: #2f6b5f;
      --scrim: rgba(20, 24, 15, 0.48);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #14180f;
    --surface: #22261b;
    --surface-2: #1a1e14;
    --ink: #f2f3e8;
    --ink-secondary: #c2c4b2;
    --muted: #8f9180;
    --line: #05060a;
    --line-soft: #34382a;
    --accent: #58cbbd;
    --accent-ink: #08201f;
    --accent-soft: #123330;
    --block-shadow: #05060a;
    --warning-soft: #3d3113;
    --warning-ink: #f2d590;
    --critical: #e8776a;
    --critical-soft: #3d1d19;
    --critical-ink: #f3aaa0;
    --sky-top: #10182f;
    --sky-bottom: #26355a;
    --sun: #e8eeff;
    --cloud: #43506f;
    --mountain-far: #2b3550;
    --mountain-near: #1c2438;
    --grass: #2f5f21;
    --grass-dark: #23491a;
    --dirt: #4a3527;
    --dirt-dark: #38281d;
    --stone: #4a4a46;
    --stone-dark: #35352f;
    --water: #2a55a0;
    --water-light: #3d74c4;
    --water-foam: #8fb4dd;
    --lava: #ff7a2f;
    --lava-bright: #ffd75e;
    --smoke: #4a4740;
    --dino: #4a9c8c;
    --dino-dark: #2f6b5f;
    --scrim: rgba(20, 24, 15, 0.48);
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --page: #dfe9d6;
    --surface: #fbfaf5;
    --surface-2: #f0eee4;
    --ink: #17170f;
    --ink-secondary: #4d4c3f;
    --muted: #7d7c6d;
    --line: #17170f;
    --line-soft: #d6d3c4;
    --accent: #1d6f7d;
    --accent-ink: #ffffff;
    --accent-soft: #d5e9ec;
    --block-shadow: #17170f;
    --warning-soft: #fbeccd;
    --warning-ink: #6b4a05;
    --critical: #c0392b;
    --critical-soft: #f7dcd8;
    --critical-ink: #7a1f1f;
    --sky-top: #6fb2e6;
    --sky-bottom: #b8dcf2;
    --sun: #ffe98a;
    --cloud: #ffffff;
    --mountain-far: #6d84a3;
    --mountain-near: #4f6480;
    --grass: #6aab3c;
    --grass-dark: #4d8c2a;
    --dirt: #8b6141;
    --dirt-dark: #6f4c33;
    --stone: #8d8d86;
    --stone-dark: #6b6b64;
    --water: #3f7fd6;
    --water-light: #6fa8ea;
    --water-foam: #dceaf8;
    --lava: #ef6f2b;
    --lava-bright: #ffc23d;
    --smoke: #b9b4ad;
    --dino: #35766a;
    --dino-dark: #24564d;
    --scrim: rgba(223, 233, 214, 0.30);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- The Overworld behind everything ----
     The landscape is anchored to the bottom and scales with viewport width,
     so it reads as a horizon rather than being blown up to fill the screen.
     Sky above it is the container's own gradient. */
  .scene {
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
  }
  .scene svg {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; height: auto; display: block;
  }
  .scene-scrim { position: fixed; inset: 0; z-index: -1; background: var(--scrim); }

  @keyframes fall { from { transform: translateY(0); } to { transform: translateY(16px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(26px); } }
  @keyframes flicker { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
  @keyframes rise { from { transform: translateY(0); opacity: 0.55; } to { transform: translateY(-22px); opacity: 0; } }
  @keyframes swim { from { transform: translateX(-4px); } to { transform: translateX(36px); } }
  @keyframes bob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  .water-fall { animation: fall 1.1s linear infinite; }
  .cloud-drift { animation: drift 22s linear infinite alternate; }
  .lava-glow { animation: flicker 2.4s ease-in-out infinite; }
  .smoke-puff { animation: rise 6s linear infinite; }
  .smoke-puff:nth-of-type(2) { animation-delay: 2s; }
  .smoke-puff:nth-of-type(3) { animation-delay: 4s; }
  .plesio { animation: swim 19s ease-in-out infinite alternate; }
  .plesio-bob { animation: bob 3.4s ease-in-out infinite; }

  /* ---- Blocky UI primitives ---- */
  .block {
    background: var(--surface);
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--block-shadow);
  }

  .shell { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  .hidden { display: none !important; }

  /* ---- Login ---- */
  #login-view {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 1.25rem; text-align: center;
  }
  .login-card { padding: 2rem 1.75rem; max-width: 22rem; }
  #login-view h1 { font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  #login-view p { color: var(--ink-secondary); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .btn-google {
    display: inline-flex; align-items: center; gap: 0.6rem; justify-content: center;
    background: var(--accent); color: var(--accent-ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    padding: 0.8rem 1.4rem; font-weight: 700; width: 100%;
  }
  .btn-google:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--block-shadow); }

  /* ---- Header ---- */
  header.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; }
  header.topbar h1 {
    font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; text-transform: uppercase;
    background: var(--surface); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    padding: 0.4rem 0.75rem;
  }
  .icon-btn {
    background: var(--surface-2); border: 3px solid var(--line); color: var(--ink-secondary);
    padding: 0.4rem 0.7rem; font-size: 0.8rem; font-weight: 600; box-shadow: 3px 3px 0 var(--block-shadow);
  }
  .icon-btn:hover { background: var(--accent); color: var(--accent-ink); }

  /* ---- Hero stat ---- */
  .hero { padding: 1.5rem 1.25rem; margin-bottom: 1rem; text-align: center; }
  .hero .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
  .hero .value {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 3.4rem; font-weight: 700; margin: 0.25rem 0; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--accent);
  }
  .hero .sub { font-size: 0.85rem; color: var(--ink-secondary); }

  /* ---- Banners ---- */
  .connection-banner {
    background: var(--warning-soft); color: var(--warning-ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    padding: 0.7rem 0.9rem; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;
  }
  .connection-banner.is-error { background: var(--critical-soft); color: var(--critical-ink); }

  .banner {
    display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.85rem 1rem;
    margin-bottom: 1rem; font-size: 0.9rem;
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
  }
  .banner.warning { background: var(--warning-soft); color: var(--warning-ink); }
  .banner.critical { background: var(--critical-soft); color: var(--critical-ink); }
  .banner .bicon { flex: 0 0 auto; font-weight: 700; }
  .banner strong { display: block; margin-bottom: 0.15rem; }

  /* ---- Buttons ---- */
  .quick-add { display: flex; gap: 0.7rem; margin-bottom: 1rem; }
  .btn-primary {
    flex: 1; background: var(--accent); color: var(--accent-ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    padding: 0.95rem 1rem; font-weight: 700; font-size: 0.95rem;
  }
  .btn-secondary {
    background: var(--surface); color: var(--ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    padding: 0.95rem 1rem; font-weight: 700;
  }
  .btn-primary:active, .btn-secondary:active, .icon-btn:active {
    transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--block-shadow);
  }
  .btn-primary:disabled, .btn-secondary:disabled {
    opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--block-shadow);
  }

  /* ---- Cards ---- */
  section.card { padding: 1.1rem 1.1rem 1.25rem; margin-bottom: 1rem; }
  section.card h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    margin: 0 0 0.9rem; font-weight: 700;
  }

  /* ---- Segmented control ---- */
  .seg { display: inline-flex; border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--block-shadow); }
  .seg button {
    border: 0; border-right: 3px solid var(--line); background: var(--surface-2);
    color: var(--ink-secondary); padding: 0.4rem 0.8rem; font-size: 0.8rem; font-weight: 700;
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .graph-controls { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .weeks-stepper { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--ink-secondary); }
  .weeks-stepper input { width: 3.4rem; border: 3px solid var(--line); padding: 0.25rem 0.4rem; background: var(--surface-2); color: var(--ink); text-align: center; }

  /* ---- Chart ---- */
  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; overflow: visible; }
  .chart-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 0; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: var(--surface);
    font-size: 0.75rem; padding: 0.3rem 0.5rem; border: 2px solid var(--line);
    transform: translate(-50%, -120%); white-space: nowrap; opacity: 0; transition: opacity 0.1s;
    font-variant-numeric: tabular-nums;
  }
  .chart-tooltip.show { opacity: 1; }

  /* ---- Entries ---- */
  .entry {
    display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: start;
    padding: 0.85rem 0.5rem; border-bottom: 2px solid var(--line-soft); cursor: pointer;
  }
  .entry:hover { background: var(--surface-2); }
  .entry:last-child { border-bottom: none; }
  .entry .etype {
    display: inline-block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; padding: 0.15rem 0.45rem; margin-bottom: 0.35rem;
    border: 2px solid var(--line);
  }
  .etype.period_start { background: var(--accent); color: var(--accent-ink); }
  .etype.period_end { background: var(--surface-2); color: var(--ink-secondary); }
  .etype.note { background: var(--warning-soft); color: var(--warning-ink); }
  .entry .edate { font-weight: 700; font-size: 0.9rem; }
  .entry .enote { color: var(--ink-secondary); font-size: 0.85rem; margin-top: 0.2rem; }
  .entry .echevron { color: var(--muted); font-size: 0.9rem; padding-top: 0.2rem; }
  .empty-state { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1.5rem 0; }

  /* ---- Edit sheet ---- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(5, 6, 10, 0.55); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .sheet {
    background: var(--surface); width: 100%; max-width: 480px;
    border: 3px solid var(--line); border-bottom: none; padding: 1.25rem 1.25rem 2rem;
  }
  .sheet h3 { margin: 0 0 1rem; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .field { margin-bottom: 0.9rem; }
  .field label { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .field input[type="date"], .field input[type="time"], .field textarea, .field select {
    width: 100%; border: 3px solid var(--line); padding: 0.6rem 0.7rem;
    background: var(--surface-2); color: var(--ink);
  }
  .field textarea { min-height: 4.5rem; resize: vertical; }
  .field-row { display: flex; gap: 0.6rem; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; align-items: stretch; }
  .sheet-actions .btn-primary { flex: 1; }
  .btn-danger {
    background: var(--critical-soft); color: var(--critical-ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--block-shadow);
    font-weight: 700; padding: 0.95rem 0.9rem;
  }
  .btn-danger:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--block-shadow); }

  /* ---- Settings ---- */
  .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0; border-top: 2px solid var(--line-soft); }
  .settings-row:first-child { border-top: none; }
  .settings-row span.k { font-size: 0.88rem; }
  .settings-row span.v { font-size: 0.95rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .settings-row input[type="number"] { width: 5rem; border: 3px solid var(--line); padding: 0.35rem 0.5rem; background: var(--surface-2); color: var(--ink); text-align: right; }
  .settings-hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.6rem; }

  /* ---- Export ---- */
  .export-row { display: flex; gap: 0.7rem; }
  .export-row button { flex: 1; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--surface); padding: 0.6rem 1rem;
    border: 3px solid var(--line); font-size: 0.85rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ──────────────────────────────────────────────────────────────────
     Desktop. Below 900px this stays the single phone column it was
     designed as; above it, the column becomes two so a laptop isn't
     just a phone screen with empty space either side.
     ────────────────────────────────────────────────────────────────── */
  @media (min-width: 900px) {
    .shell { max-width: 62rem; padding: 2rem 1.5rem 4rem; }
    /* Named areas rather than per-item columns: auto-placement won't
       backtrack, so column 2 used to start level with the quick-add row and
       leave a hole beside the hero. */
    #app-view {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      grid-template-areas:
        "head  head"
        "conn  conn"
        "flag  flag"
        "hero  log"
        "quick log"
        "trend log"
        "avg   exp";
      gap: 1.25rem;
      align-items: start;
    }
    header.topbar    { grid-area: head; }
    #connection-banner { grid-area: conn; }
    #flag-banner-slot  { grid-area: flag; }
    .hero            { grid-area: hero; }
    .quick-add       { grid-area: quick; }
    #trend-card      { grid-area: trend; }
    #log-card        { grid-area: log; }
    #average-card    { grid-area: avg; }
    #export-card     { grid-area: exp; }

    #flag-banner-slot:empty { display: none; }
    .hero, .quick-add, section.card { margin-bottom: 0; }
    .hero .value { font-size: 4.5rem; }
    header.topbar h1 { font-size: 1.15rem; }
    #log-card { max-height: 34rem; overflow-y: auto; }
  }

  /* ---- Print report ---- */
  #report-view { display: none; }
  @media print {
    body * { visibility: hidden; }
    .scene, .scene-scrim { display: none; }
    #report-view, #report-view * { visibility: visible; }
    #report-view { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; }
    .no-print { display: none !important; }
  }
  #report-view { padding: 1.5rem; color: #17170f; background: #fff; }
  #report-view h1 { font-size: 1.3rem; margin: 0 0 0.15rem; }
  #report-view .meta { color: #4d4c3f; font-size: 0.85rem; margin-bottom: 1.25rem; }
  #report-view .stats { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
  #report-view .stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #4d4c3f; }
  #report-view .stat .v { font-size: 1.4rem; font-weight: 700; }
  #report-view table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  #report-view th, #report-view td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #d6d3c4; }
  #report-view th { color: #4d4c3f; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }

  @media (prefers-reduced-motion: reduce) {
    *, .water-fall, .cloud-drift, .lava-glow, .smoke-puff, .plesio, .plesio-bob {
      transition: none !important; animation: none !important;
    }
  }
</style>
</head>
<body>

<!-- ── The Overworld: waterfall on the left, volcano on the right ── -->
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 960 420" preserveAspectRatio="xMidYMax meet" shape-rendering="crispEdges">
    <defs>
      <clipPath id="fallClip"><rect x="96" y="212" width="56" height="140"/></clipPath>
      <clipPath id="volcanoClip"><rect x="700" y="196" width="240" height="144"/></clipPath>
    </defs>

    <!-- sun, out near the right margin where content rarely reaches -->
    <rect x="862" y="40" width="36" height="36" fill="var(--sun)"/>
    <rect x="852" y="50" width="56" height="16" fill="var(--sun)"/>

<div class="scene-scrim" aria-hidden="true"></div>

<div id="login-view" class="shell">
  <div class="login-card block">
    <h1>Mary's Cycle Tracker</h1>
    <p>A private log — only you and Roger can see it. Sign in with Google to continue.</p>
    <button id="google-signin" class="btn-google">Sign in with Google</button>
  </div>
</div>

<div id="app-view" class="shell hidden">
  <header class="topbar">
    <h1>Cycle Tracker</h1>
    <button id="signout-btn" class="icon-btn">Sign out</button>
  </header>

  <div id="connection-banner" class="connection-banner hidden"></div>

  <div class="hero block">
    <div class="label" id="day-count-label">Days since last entry</div>
    <div class="value" id="day-count">—</div>
    <div class="sub" id="day-count-sub"></div>
  </div>

  <div id="flag-banner-slot"></div>

  <div class="quick-add no-print">
    <button id="log-start-btn" class="btn-primary">+ Log start date</button>
    <button id="log-other-btn" class="btn-secondary">Other</button>
  </div>

  <section class="card block" id="log-card">
    <h2>Log</h2>
    <div id="entries-list"></div>
  </section>

  <section class="card block" id="trend-card">
    <h2>Trend</h2>
    <div class="graph-controls">
      <div class="seg" id="graph-mode">
        <button data-mode="weeks">Weeks</button>
        <button data-mode="months" class="on">Months</button>
        <button data-mode="year">Year</button>
      </div>
      <div class="weeks-stepper hidden" id="weeks-stepper">
        <span>last</span>
        <input type="number" id="weeks-count" min="4" max="52" value="12">
        <span>weeks</span>
      </div>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 400 200" role="img" aria-label="Cycle length trend"></svg>
      <div class="chart-tooltip" id="chart-tooltip"></div>
    </div>
  </section>

  <section class="card block" id="average-card">
    <h2>Your average</h2>
    <div class="settings-row">
      <span class="k">Average cycle length</span>
      <span class="v" id="avg-display">—</span>
    </div>
    <div class="settings-row">
      <span class="k">Manual override</span>
      <input type="number" id="avg-override-input" placeholder="auto" min="10" max="90">
    </div>
    <div class="settings-hint">Leave blank to let it update automatically as new cycles complete.</div>
  </section>

  <section class="card block no-print" id="export-card">
    <h2>Export</h2>
    <div class="export-row">
      <button id="export-csv-btn" class="btn-secondary">Download CSV</button>
      <button id="export-report-btn" class="btn-secondary">Report</button>
    </div>
  </section>
</div>

<div id="sheet-slot"></div>
<div id="toast"></div>
<div id="report-view"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
