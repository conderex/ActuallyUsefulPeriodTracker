name: Keep Supabase warm

# Supabase's free tier pauses a project after ~7 days without database traffic
# and then every read and write fails until the project is restored from the
# dashboard. This workflow pings a tiny stored function every day so the
# project never crosses that inactivity threshold.
#
# Reads SUPABASE_URL and SUPABASE_ANON_KEY straight out of js/config.js so
# there is no secret to configure. Those values are already public in the
# deployed HTML; they only unlock what RLS allows, which for the anon role is
# execute-on the heartbeat() function and nothing else.

on:
  schedule:
    # Daily at 06:27 UTC. The off-minute reduces the chance of GitHub skipping
    # the run during a hot cron minute like :00 or :30.
    - cron: '27 6 * * *'
  workflow_dispatch: {}

# One at a time; if a run somehow overlaps another, skip rather than pile up.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

# Needs write so the "stay-alive" step can push a marker commit. Without
# any push the repo has no activity and GitHub disables the scheduled
# workflow after 60 days (which is exactly what happened the first time).
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git log` on the marker file can find its last
          # commit date.
          fetch-depth: 0

      - name: Read Supabase config from js/config.js
        id: cfg
        run: |
          set -euo pipefail
          url=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" js/config.js)
          key=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY in js/config.js" >&2
            exit 1
          fi
          # Do NOT print the key to the log; only its length as a sanity check.
          echo "url=$url" >>"$GITHUB_OUTPUT"
          # Mask so any accidental future echo of $key is redacted.
          echo "::add-mask::$key"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "url ok, key length ${#key}"

      - name: Call heartbeat()
        run: |
          set -euo pipefail
          url='${{ steps.cfg.outputs.url }}'
          key='${{ steps.cfg.outputs.key }}'
          # Retry a few times to shake off transient network flakes without
          # the whole run being marked failed on a single blip.
          for attempt in 1 2 3; do
            body_file=$(mktemp)
            status=$(curl -sS --max-time 15 \
              -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H "apikey: $key" \
              -H "Authorization: Bearer $key" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$url/rest/v1/rpc/heartbeat")
            if [ "$status" = "200" ]; then
              echo "heartbeat ok: $(cat "$body_file")"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status"
            cat "$body_file"
            sleep 5
          done
          echo "heartbeat failed after 3 attempts" >&2
          exit 1

      - name: Keep the repository active (defeat GitHub's 60-day workflow disable)
        # Only when the heartbeat above succeeded; `set -e` on the previous
        # step would have aborted the job otherwise.
        run: |
          set -euo pipefail
          marker=".github/keepalive-last-ping.txt"

          # When was the marker last committed? If never, treat as the epoch
          # so the first run always produces a commit and seeds the file.
          last_commit_ts=$(git log -1 --format=%ct -- "$marker" 2>/dev/null || true)
          last_commit_ts=${last_commit_ts:-0}
          now_ts=$(date -u +%s)
          days_since=$(( (now_ts - last_commit_ts) / 86400 ))

          echo "days since marker last committed: $days_since"

          # Commit at most every 14 days so git history stays small; GitHub's
          # disable threshold is 60 days, so this has 4x headroom.
          if [ "$days_since" -lt 14 ]; then
            echo "within 14-day window, skipping commit"
            exit 0
          fi

          date -u +%Y-%m-%dT%H:%M:%SZ > "$marker"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "chore(keepalive): mark repo active $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
